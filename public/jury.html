<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KTA Jury Scoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="mast">
  <svg viewBox="0 0 1000 220" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 200 C 260 190, 520 170, 700 110 S 930 10, 1020 -10" fill="none" stroke="#e0b44a" stroke-width="2" opacity=".75"/></svg>
  <div class="mast-in">
    <div class="topline"><a class="brand" href="/">KTA <span>Awards</span></a><nav class="links" aria-label="Pages"><a href="/">Home</a><a href="/vote">Vote</a><a href="/results">Results</a><a href="/jury" aria-current="page">Jury</a><a href="/admin">Organizer</a></nav></div>
    <div class="eyebrow">Expert jury</div>
    <h1>Jury scoring</h1>
    <p>Rate each finalist from 1 (weak) to 10 (exceptional) on the evidence in their portfolio, impact data and references.</p>
    
  </div>
</header>
<main>
<div class="panel signin" id="jlogin" hidden>
  <h2>Sign in</h2>
  <p class="sub">Use the access code the organizers gave you.</p>
  <form id="jloginForm" class="row">
    <div class="field"><label for="jcode">Access code</label><input type="text" id="jcode" autocomplete="one-time-code" placeholder="e.g. 4F9A2C1B" required></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <div class="err" id="jloginErr" role="alert"></div>
</div>
<div id="juryBody"></div>
</main>
<script src="/common.js"></script>
<script src="/jury.js"></script>
</body>
</html>
